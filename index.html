addEventListener('keydown',e=>{if(e.target.tagName=='SELECT')return;if(e.code=='Space'){e.preventDefault();$('rec').click()}else if(e.key=='m')$('mon').click();else if(e.key=='v')pick(VMS[(VMS.indexOf(VM)+1)%VMS.length])});
</script></body></html>
